name: iOS app
on:
  push:
    branches: [ios-app]
    paths: ["app/**", "index.html", ".github/workflows/ios.yml"]
  workflow_dispatch:
    inputs:
      upload:
        description: "Sign and upload to TestFlight"
        type: boolean
        default: false

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Xcode
        run: |
          ls /Applications | grep -i xcode || true
          xcodebuild -version
      - name: Web assets and Capacitor sync
        working-directory: app
        run: |
          npm ci
          npm run sync
      - name: AlarmKit API (for reference)
        continue-on-error: true
        run: |
          F=$(find "$(xcode-select -p)/Platforms/iPhoneOS.platform" -path "*AlarmKit.framework*" -name "arm64e-apple-ios.swiftinterface" | head -1)
          echo "$F"
          grep -nE "public (init|static func|func|var|struct|enum)|^@available" "$F" | grep -iE "AlarmConfiguration|init\(|schedule|cancel|Alert\(|AlertSound|requestAuthorization|authorizationState|alarms" | head -80
      - name: Build for simulator (no signing)
        working-directory: app/ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build > build.log 2>&1 && ok=1 || ok=0
          grep -E "error:|warning: .*AppDelegate" build.log | sort -u | head -40 || true
          tail -15 build.log
          test $ok -eq 1
      - name: Unsigned IPA for free sideloading (Sideloadly / AltStore)
        working-directory: app/ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath dd \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build > dev.log 2>&1 || { grep -E "error:" dev.log | sort -u | head -40; tail -15 dev.log; exit 1; }
          rm -rf Payload && mkdir Payload
          cp -R dd/Build/Products/Release-iphoneos/App.app Payload/
          zip -qry Rafiq.ipa Payload
          ls -lh Rafiq.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: Rafiq-ipa
          path: app/ios/App/Rafiq.ipa
          compression-level: 0
      - name: Archive and upload to TestFlight
        if: ${{ inputs.upload }}
        working-directory: app/ios/App
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$ASC_KEY_P8" > ~/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8
          BUILD=$(date +%Y%m%d%H%M)
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath $RUNNER_TEMP/App.xcarchive \
            DEVELOPMENT_TEAM=$TEAM_ID CODE_SIGN_STYLE=Automatic CURRENT_PROJECT_VERSION=$BUILD \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8 \
            -authenticationKeyID $ASC_KEY_ID -authenticationKeyIssuerID $ASC_ISSUER_ID \
            archive | tail -40
          cat > $RUNNER_TEMP/export.plist <<PL
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          PL
          xcodebuild -exportArchive -archivePath $RUNNER_TEMP/App.xcarchive \
            -exportOptionsPlist $RUNNER_TEMP/export.plist -exportPath $RUNNER_TEMP/out \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8 \
            -authenticationKeyID $ASC_KEY_ID -authenticationKeyIssuerID $ASC_ISSUER_ID | tail -30
